<!DOCTYPE html>
<html>

<head>

    <title>Dispatch Status Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

    <h2>Dispatch Status Report</h2>

    <a href="/sales" class="btn btn-secondary">
        Back
    </a>

</div>

    <div class="row">

        <div class="col-md-3">
            <label>From Date</label>
            <input type="date"
                   id="from_date"
                   class="form-control">
        </div>

        <div class="col-md-3">
            <label>To Date</label>
            <input type="date"
                   id="to_date"
                   class="form-control">
        </div>

        <div class="col-md-2">
            <label>&nbsp;</label>

            <button class="btn btn-primary form-control"
                    onclick="loadReport()">

                Search

            </button>
        </div>

        <div class="col-md-2">
            <label>&nbsp;</label>

            <button class="btn btn-success form-control"
                    onclick="downloadReport()">

                Download

            </button>
        </div>

    </div>

    <hr>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Date</th>
            <th>M Code</th>
            <th>Customer</th>
            <th>Part Number</th>
            <th>Size</th>
            <th>Dispatch Qty</th>
            <th>Complete</th>
            <th>Pending</th>
            <th>Status</th>
            <th>Ageing</th>
            <th>Completion Date</th>
            <th>Reason</th>

        </tr>

        </thead>

        <tbody id="reportTable"></tbody>

    </table>

</div>

<script>

function loadReport()
{
    let from_date =
    document.getElementById("from_date").value;

    let to_date =
    document.getElementById("to_date").value;

    fetch("/load_report", {

        method:"POST",

        headers:{
            "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
        "from_date=" + from_date +
        "&to_date=" + to_date

    })

    .then(res => res.json())

    .then(data => {

        console.log(data);

        let table =
        document.getElementById("reportTable");

        table.innerHTML = "";

        data.forEach(row => {

            table.innerHTML += `

            <tr>

                <td>${row.dispatch_date}</td>
                <td>${row.m_code}</td>
                <td>${row.customer}</td>
                <td>${row.part_number}</td>
                <td>${row.size}</td>
                <td>${row.dispatch_qty}</td>
                <td>${row.complete}</td>
                <td>${row.pending}</td>
                <td>${row.status}</td>
                <td>${row.ageing}</td>
                <td>${row.completion_date || ''}</td>
                <td>${row.reason || ''}</td>

            </tr>

            `;
        });

    });
}

function downloadReport()
{
    let from_date =
    document.getElementById("from_date").value;

    let to_date =
    document.getElementById("to_date").value;

    window.location =
    "/download_report?from_date=" +
    from_date +
    "&to_date=" +
    to_date;
}

</script>

</body>
</html>
