<!DOCTYPE html>
<html>

<head>

<title>Summary Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h2>Summary Report</h2>

        <a href="/fg"
           class="btn btn-secondary">
           Back
        </a>

    </div>

    <div class="row mb-3">

        <div class="col-md-3">

            <input type="month"
                   id="month"
                   class="form-control">

        </div>

        <div class="col-md-2">

            <button class="btn btn-primary"
                    onclick="loadSummary()">
                Load
            </button>

        </div>

        <div class="col-md-2">

            <button class="btn btn-success"
                    onclick="saveSummary()">
                Save
            </button>

        </div>

    </div>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Date</th>

            <th>Total Dispatch Plan Qty</th>

            <th>Total Dispatch Qty</th>

            <th>Percentage (%)</th>

            <th>Daily Production Qty</th>

        </tr>

        </thead>

        <tbody id="summaryTable">

        </tbody>

    </table>

</div>

<script>

function loadSummary()
{
    let month =
    document.getElementById("month").value;

    fetch("/load_summary", {

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:"month=" + month

    })

    .then(r=>r.json())

    .then(data=>{

        let table =
        document.getElementById("summaryTable");

        table.innerHTML="";

        data.forEach(row=>{

            table.innerHTML += `

            <tr>

                <td>${row.date}</td>

                <td>${row.plan_qty}</td>

                <td>${row.dispatch_qty}</td>

                <td>${row.percentage}%</td>

                <td>

                    <input type="number"
                           class="form-control production_qty"
                           value="${row.daily_production_qty || ''}">

                </td>

            </tr>

            `;

        });

    });
}

function saveSummary()
{
    let rows =
    document.querySelectorAll("#summaryTable tr");

    let data = [];

    rows.forEach(row=>{

        data.push({

            date: row.cells[0].innerText,
            plan_qty: row.cells[1].innerText,
            dispatch_qty: row.cells[2].innerText,
            percentage: row.cells[3].innerText,
            daily_production_qty:
                row.querySelector(".production_qty").value

            });

    });
    fetch("/save_summary",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    })

    .then(r=>r.json())

    .then(data=>{

        if(data.success)
        {
            alert("Summary Saved Successfully");
        }

    });

}

</script>

</body>
</html>
